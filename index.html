<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDescription" content="AI Ecosystem Catalog">
<title>AI Ecosystem Catalog v12</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="heroTop">
    <div>
      <h1>AI Ecosystem Catalog</h1>
      <p><b id="versionText">v12</b> <span id="heroText"></span></p>
    </div>
    <div class="languageBox" aria-label="Language selector">
      <span id="languageLabel">Язык</span>
      <div class="langSwitch" id="langSwitch">
        <button class="langBtn" data-lang="ru">RU</button>
        <button class="langBtn" data-lang="en">EN</button>
        <button class="langBtn" data-lang="zh">中文</button>
      </div>
    </div>
  </div>
  <div class="pills" id="summary"><span class="pill" id="loadingText">Загрузка данных…</span></div>
</header>

<section class="hub navigator">
  <div class="navbox">
    <h2 id="navigatorTitle">Подобрать под работу</h2>
    <p class="muted" id="navigatorText"></p>
    <div class="selectGrid">
      <label><span id="professionLabel">Профессия</span><select id="profession" class="select"></select></label>
      <label><span id="taskLabel">Что нужно сделать</span><select id="task" class="select"></select></label>
    </div>
    <div class="filters" id="quickFilters"></div>
    <button class="btn" id="clearNavigator" style="margin-top:10px"></button>
  </div>
  <div class="navbox">
    <h2 id="recipesTitle">Готовые стеки</h2>
    <p class="muted" id="recipesText"></p>
    <div class="recipeGrid" id="recipes"></div>
  </div>
</section>

<div class="tabs" id="tabs">
  <button class="chip tab active" data-section="catalog" id="tabCatalog"></button>
  <button class="chip tab" data-section="paid" id="tabPaid"></button>
  <button class="chip tab" data-section="repos" id="tabRepos"></button>
  <button class="chip tab" data-section="radar" id="tabRadar"></button>
</div>

<section id="catalog" class="section active">
  <div class="toolbar">
    <input id="catalogQ" class="search" type="search">
    <div class="filterRow">
      <div id="catalogKinds" class="filters"></div>
      <select id="catalogSort" class="sort">
        <option value="relevance"></option>
        <option value="newest"></option>
        <option value="name"></option>
      </select>
    </div>
    <div id="catalogStats" class="stats"></div>
  </div>
  <main id="catalogGrid" class="grid"></main>
</section>

<section id="paid" class="section">
  <div class="toolbar">
    <input id="paidQ" class="search" type="search">
    <div class="filterRow">
      <div id="paidFilters" class="filters"></div>
      <select id="paidSort" class="sort">
        <option value="name"></option>
        <option value="free"></option>
      </select>
    </div>
    <div id="paidStats" class="stats"></div>
  </div>
  <main id="paidGrid" class="grid"></main>
</section>

<section id="repos" class="section">
  <div class="warning" id="repoWarning"></div>
  <div class="toolbar">
    <input id="repoQ" class="search" type="search">
    <div class="filterRow">
      <div id="repoFilters" class="filters"></div>
      <select id="repoSort" class="sort">
        <option value="curated"></option>
        <option value="stars">Stars ↓</option>
        <option value="health"></option>
        <option value="name"></option>
      </select>
    </div>
    <div id="repoStats" class="stats"></div>
  </div>
  <main id="repoGrid" class="grid"></main>
</section>

<section id="radar" class="section">
  <div class="hub">
    <h2 id="radarTitle"></h2>
    <p class="muted" id="radarText"></p>
  </div>
  <main id="radarGrid" class="radarGrid"></main>
</section>

<footer>
  <span id="footerText"></span>
  · <a href="https://github.com/Nioris/ai-ecosystem-catalog">GitHub</a>
  · <a href="CHANGELOG.md">Changelog</a>
  · <a href="TRANSLATIONS.md">Translations</a>
</footer>
</div>

<script src="app.js"></script>
</body>
</html>
