name: Check i18n

on:
  push:
    paths:
      - "locales/**"
      - "app.js"
      - "index.html"
      - "scripts/check_i18n.py"
      - ".github/workflows/check-i18n.yml"
  pull_request:
    paths:
      - "locales/**"
      - "app.js"
      - "index.html"
      - "scripts/check_i18n.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_i18n.py
