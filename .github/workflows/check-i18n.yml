name: Check i18n

on:
  push:
    paths:
      - "locales/**"
      - "app.js"
      - "i18n-runtime.js"
      - "filter-v12.2.js"
      - "v13-update.js"
      - "v14-update.js"
      - "v14.1-update.js"
      - "data/v13-extra.json"
      - "data/v13-extra.b64"
      - "data/v14-extra.json"
      - "data/v14.1-uncensored.json"
      - "index.html"
      - "scripts/check_i18n.py"
      - ".github/workflows/check-i18n.yml"
  pull_request:
    paths:
      - "locales/**"
      - "app.js"
      - "i18n-runtime.js"
      - "filter-v12.2.js"
      - "v13-update.js"
      - "v14-update.js"
      - "v14.1-update.js"
      - "data/v13-extra.json"
      - "data/v13-extra.b64"
      - "data/v14-extra.json"
      - "data/v14.1-uncensored.json"
      - "index.html"
      - "scripts/check_i18n.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check i18n-runtime.js
          node --check filter-v12.2.js
          node --check v13-update.js
          node --check v14-update.js
          node --check v14.1-update.js
      - name: Check release data
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib
          p=pathlib.Path('data/v13-extra.b64')
          data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode('utf-8'))
          assert data['version']=='v13'
          assert len(data.get('newModels',[])) >= 10
          v14=json.loads(pathlib.Path('data/v14-extra.json').read_text(encoding='utf-8'))
          assert v14['version']=='v14'
          assert len(v14.get('newModels',[])) >= 2
          assert len(v14.get('newTools',[])) >= 6
          assert any(x.get('name')=='Official Unity Agent Plugin' for x in v14.get('newTools',[]))
          u=json.loads(pathlib.Path('data/v14.1-uncensored.json').read_text(encoding='utf-8'))
          assert u['version']=='v14.1'
          assert len(u.get('models',[])) >= 8
          assert all(x.get('source','').startswith('https://huggingface.co/') for x in u['models'])
          assert all(x.get('risk') for x in u['models'])
          assert all(x.get('i18n',{}).get('ru') and x.get('i18n',{}).get('zh') for x in u['models'])
          print('release data OK:', len(data.get('newModels',[])), 'v13 models,', len(v14.get('newTools',[])), 'v14 tools,', len(u['models']), 'reduced-safeguards models')
          PY
      - run: python scripts/check_i18n.py
