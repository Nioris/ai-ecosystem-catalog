name: Check i18n

on:
  push:
    paths:
      - "locales/**"
      - "app.js"
      - "i18n-runtime.js"
      - "filter-v12.2.js"
      - "v13-update.js"
      - "data/v13-extra.json"
      - "data/v13-extra.b64"
      - "index.html"
      - "scripts/check_i18n.py"
      - ".github/workflows/check-i18n.yml"
  pull_request:
    paths:
      - "locales/**"
      - "app.js"
      - "i18n-runtime.js"
      - "filter-v12.2.js"
      - "v13-update.js"
      - "data/v13-extra.json"
      - "data/v13-extra.b64"
      - "index.html"
      - "scripts/check_i18n.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check i18n-runtime.js
          node --check filter-v12.2.js
          node --check v13-update.js
      - name: Check v13 compressed data
        run: |
          python - <<'PY'
          import base64, gzip, json, pathlib
          p=pathlib.Path('data/v13-extra.b64')
          data=json.loads(gzip.decompress(base64.b64decode(p.read_text().strip())).decode('utf-8'))
          assert data['version']=='v13'
          assert len(data.get('newModels',[])) >= 10
          print('v13 data OK:', len(data.get('newModels',[])), 'new models')
          PY
      - run: python scripts/check_i18n.py
