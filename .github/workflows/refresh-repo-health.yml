name: Refresh repository health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "data/repo-sources.json"
      - "scripts/refresh_repo_health.py"
      - ".github/workflows/refresh-repo-health.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_repo_health.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repo-health.json
          if git diff --cached --quiet; then
            echo "No repository health changes"
          else
            git commit -m "chore: refresh repository health snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
